name: CI/CD Pipeline - Flight Support Agent

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # 1. Quality Gate: Offline Validation (Zero Cloudflare Secrets Required)
  # --------------------------------------------------------------------------
  test-and-verify:
    name: Lint, Test & Bundle Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Compile Check
        run: npm run typecheck

      - name: Run Automated Unit Tests (26 Tests Across 5 Suites)
        run: npm test

      - name: Validate Bundle & Bindings (Offline Dry-Run)
        run: npx wrangler deploy --dry-run

  # --------------------------------------------------------------------------
  # 2. Production Deploy: Schema Sync & Worker Release
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy to Cloudflare Platform
    needs: test-and-verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Apply D1 Schema Migrations (Strict DDL Only - No Seeding)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Applying DDL schema (tables and indexes)..."
          npx wrangler d1 execute flight-support-db --remote --file=./schema.sql

      - name: Deploy Worker & Static Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify Production Deployments List
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deployments list
